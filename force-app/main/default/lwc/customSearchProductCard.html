<template lwc:render-mode="light">
    <section class={cardContainerClass}>
        <div class="imageArea">
            <figure
                class="productImage"
                if:true={showProductImage}
                onkeydown={handleKeydown}
                onclick={handleProductDetailPageNavigation}>
                <experience-picture
                    alternative-text={image.alternateText}
                    url={image.url}
                    images={image.images}
                    loading="lazy"></experience-picture>
            </figure>
        </div>

        <div class="fieldsArea">
            <a
                class="slds-var-p-top_x-small slds-text-link_reset"
                onkeydown={handleKeydown}
                onclick={handleProductDetailPageNavigation}>
                <template
                    for:each={fields}
                    for:item="field">
                    <div key={field.displayData.name} class={field.cssClass} data-field-name={field.displayData.name} tabindex={field.displayData.tabStoppable}>
                        <lightning-formatted-text value={field.displayData.value}></lightning-formatted-text>
                    </div>
                </template>
            </a>
        </div>

        <div
            class="subscriptionArea"
            if:true={isSubscriptionProduct}>
            <lightning-formatted-text value={subscriptionOptionsLabelText}></lightning-formatted-text>
        </div>

        <template if:false={isSubscriptionProduct}>
            <!-- CUSTOM: Using pricedisplay component with 'c' suffix support -->
            <div
                class="priceArea"
                if:true={showPrice}>
                <c-pricedisplay
                    product-pricing={pricingInfo}
                    current-pricebook-id={currentPricebookId}
                    special-pricebook-id={specialPricebookIds}
                    pricing-type="1_TIER"></c-pricedisplay>
            </div>

            <div
                class="quantityRuleArea"
                if:true={showInlineQuantitySelectorText}>
                <lightning-formatted-text value={quantityRuleCombinedText}></lightning-formatted-text>
            </div>
        </template>

        <div
            if:true={showCallToActionButton}
            class="callToActionArea">
            <template if:false={isCTAButtonViewOptions}>
                <div class={quantitySelectorClassList}>
                    <lightning-input
                        if:true={showInlineQuantitySelector}
                        type="number"
                        name="quantity"
                        label={quantitySelectorLabelText}
                        value={quantityRuleMinimum}
                        min={quantityRuleMinimum}
                        max={quantityRuleMaximum}
                        step={quantityRuleIncrement}
                        disabled={disabled}
                        onchange={handleQuantityChange}
                        message-when-range-overflow={maximumText}
                        message-when-range-underflow={minimumText}
                        message-when-step-mismatch={incrementText}
                        required></lightning-input>
                    <lightning-button
                        if:true={isCTAButtonAddToCart}
                        label={addToCartButtonText}
                        title={addToCartButtonAriaLabel}
                        disabled={addToCartButtonDisabled}
                        data-product-id={displayData.id}
                        class="callToActionButton"
                        variant={actionButtonVariant}
                        onclick={handleAddToCart}>
                    </lightning-button>
                </div>
            </template>
            <a
                if:true={isCTAButtonViewOptions}
                href={_productUrl}
                title={viewOptionsButtonAriaLabel}
                data-product-id={displayData.id}
                class="callToActionButton slds-button"
                onclick={handleProductDetailPageNavigation}>
                {configuration.viewOptionsButtonText}
            </a>
        </div>
    </section>
</template>
